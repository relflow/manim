name: Check and preview

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install Cairo and Pango
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - run: uv sync --locked
      - run: make check
      - name: Render an animation without narration
        run: uv run python -m tools.build first-model --quality preview --voice silent
      - uses: actions/upload-artifact@v4
        with:
          name: first-model-preview
          path: dist/first-model/
